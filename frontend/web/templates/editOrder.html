<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Detail</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    <style>
      body {
        padding-top: 50px;
        padding-bottom: 20px;
      }
      .navbar {
        margin-bottom: 20px;
      }
      .form-container {
        max-width: 600px;
        margin: 0 auto;
      }
      .items-table {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
      <a class="navbar-brand" href="/dashboard">Store Management</a>
      <button
        class="navbar-toggler"
        type="button"
        data-toggle="collapse"
        data-target="#navbarCollapse"
        aria-controls="navbarCollapse"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
    </nav>

    <div class="container">
      <div class="form-container">
        <h2 class="mt-4">Order Detail</h2>

        <input type="hidden" id="order-id" value="{{ id }}" />

        <div class="form-group">
          <label for="user-name">User</label>
          <input type="text" class="form-control" id="user-name" readonly />
        </div>
        <div class="form-group">
          <label for="user-email">Email</label>
          <input type="text" class="form-control" id="user-email" readonly />
        </div>
        <div class="form-group">
          <label for="total">Total</label>
          <input type="text" class="form-control" id="total" readonly />
        </div>
        <div class="form-group">
          <label for="created-at">Date</label>
          <input type="text" class="form-control" id="created-at" readonly />
        </div>

        <h4 class="mt-4">Order Items</h4>
        <table id="items-table" class="table table-bordered items-table">
          <thead>
            <tr>
              <th>Product ID</th>
              <th>Quantity</th>
              <th>Unit Price</th>
              <th>Subtotal</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <a href="/orders" class="btn btn-secondary mt-2">Back to Orders</a>
      </div>
    </div>

    <script src="/static/scriptOrders.js"></script>
    <script>
      // Carga el detalle de la orden al abrir la página
      document.addEventListener("DOMContentLoaded", function () {
        const orderId = document.getElementById("order-id").value;
        getOrder(orderId);
      });
    </script>
  </body>
</html>
