<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Detail</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />

    <style>
      body {
        padding-top: 70px;
        background-color: #f4f6f9;
      }

      .navbar {
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      }

      .card-custom {
        border: none;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }

      .card-header-custom {
        background: linear-gradient(90deg, #1f3c88, #2b5797);
        color: white;
        font-weight: 600;
        font-size: 18px;
        border-radius: 12px 12px 0 0;
        padding: 15px 20px;
      }

      .info-label {
        font-weight: 600;
        color: #555;
      }

      .total-box {
        background: #e9eef5;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
      }

      .total-box input {
        font-size: 22px;
        font-weight: bold;
        text-align: center;
        border: none;
        background: transparent;
      }

      .items-table thead {
        background-color: #1f3c88;
        color: white;
      }

      .items-table tbody tr:hover {
        background-color: #f1f3f8;
      }

      .btn-back {
        border-radius: 25px;
        padding: 8px 25px;
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
      <a class="navbar-brand font-weight-bold" href="/dashboard">
        Store Management
      </a>
    </nav>

    <div class="container">
      <div class="card card-custom">
        <div class="card-header-custom">
          Order Detail
        </div>

        <div class="card-body">

          <input type="hidden" id="order-id" value="{{ id }}" />

          <div class="row">
            <div class="col-md-8">

              <div class="form-group">
                <label class="info-label" for="user-name">User</label>
                <input type="text" class="form-control" id="user-name" readonly />
              </div>

              <div class="form-group">
                <label class="info-label" for="user-email">Email</label>
                <input type="text" class="form-control" id="user-email" readonly />
              </div>

              <div class="form-group">
                <label class="info-label" for="created-at">Date</label>
                <input type="text" class="form-control" id="created-at" readonly />
              </div>

            </div>

            <div class="col-md-4">
              <div class="total-box">
                <label class="info-label" for="total">Total</label>
                <input type="text" id="total" readonly />
              </div>
            </div>
          </div>

          <h5 class="mt-4 font-weight-bold">Order Items</h5>

          <table id="items-table" class="table table-bordered items-table mt-3">
            <thead>
              <tr>
                <th>Product ID</th>
                <th>Quantity</th>
                <th>Unit Price</th>
                <th>Subtotal</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>

          <div class="text-right">
            <a href="/orders" class="btn btn-secondary btn-back">
              Back to Orders
            </a>
          </div>

        </div>
      </div>
    </div>

    <script src="/static/scriptOrders.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const orderId = document.getElementById("order-id").value;
        getOrder(orderId);
      });
    </script>
  </body>
</html>
