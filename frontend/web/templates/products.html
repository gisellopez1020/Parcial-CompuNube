<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Management</title>

<link
  rel="stylesheet"
  href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
/>

<style>

  body {
    background: #f4f6f9;
    padding-top: 80px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  /* NAVBAR */
  .navbar {
    background: #ffffff !important;
    box-shadow: 0 3px 15px rgba(0, 0, 0, 0.05);
    padding: 15px 40px;
  }

  .navbar-brand {
    font-weight: 700;
    font-size: 1.3rem;
    color: #1e3c72 !important;
  }

  /* FORM CARD */
  .card-custom {
    border-radius: 15px;
    border: none;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
  }

  .card-header-custom {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
    border-radius: 15px 15px 0 0;
    padding: 15px 20px;
    font-weight: 600;
  }

  .btn-primary-custom {
    color: white;
    background: #1e3c72;
    border: none;
    border-radius: 10px;
    padding: 8px 20px;
    transition: 0.3s ease;
  }

  .btn-primary-custom:hover {
    background: #16325c;
    color: white;
  }

  /* TABLE */
  .table thead {
    background-color: #1e3c72;
    color: white;
  }

  .table tbody tr:hover {
    background-color: #f1f4f8;
  }

  h2 {
    font-weight: 600;
    color: #1e3c72;
    margin-bottom: 20px;
  }

</style>

</head>

<body>

<nav class="navbar navbar-expand-md fixed-top">
  <a class="navbar-brand" href="/dashboard">Mini Store</a>
</nav>

<div class="container">

  <!-- FORMULARIO -->
  <div class="card card-custom mb-5">
    <div class="card-header-custom">
      Add New Product
    </div>
    <div class="card-body">

      <form id="add-product-form">

        <div class="form-row">
          <div class="form-group col-md-4">
            <label>Name</label>
            <input type="text" class="form-control" id="name" required />
          </div>

          <div class="form-group col-md-4">
            <label>Price</label>
            <input type="number" step="0.01" class="form-control" id="price" required />
          </div>

          <div class="form-group col-md-4">
            <label>Quantity</label>
            <input type="number" class="form-control" id="quantity" required />
          </div>
        </div>

        <button type="button" class="btn btn-primary-custom" onclick="createProduct()">
          Create Product
        </button>

      </form>
    </div>
  </div>

  <!-- TABLA -->
  <h2>Products List</h2>

  <div class="card card-custom p-3">
    <table id="product-list" class="table table-hover">
      <thead>
        <tr>
          <th>Id</th>
          <th>Name</th>
          <th>Price</th>
          <th>Available Quantity</th>
          <th>Order Quantity</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="mt-3">
      <button class="btn btn-outline-primary mr-2" onclick="getProducts()">
        Get Products
      </button>

      <button class="btn btn-success" onclick="orderProducts()">
        Order Products
      </button>
    </div>

  </div>

</div>

<script src="static/scriptProducts.js"></script>

</body>
</html>
