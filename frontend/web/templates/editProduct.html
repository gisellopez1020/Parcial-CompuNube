<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Product</title>

    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />

    <style>
      body {
        background-color: #f4f6f9;
        padding-top: 70px;
      }

      .card-custom {
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        border: none;
      }

      .card-header-custom {
        background: linear-gradient(90deg, #1f3c88, #2b5797);
        color: white;
        padding: 15px 20px;
        border-radius: 12px 12px 0 0;
      }

      .container {
        max-width: 600px;
      }

      .btn-custom {
        border-radius: 25px;
        padding: 8px 25px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card card-custom">
        <div class="card-header-custom">
          Edit Product
        </div>

        <div class="card-body">

          <!-- Agregar enlace para volver a la página de inicio -->
          <div class="text-right mb-3">
            <a href="/products" class="btn btn-secondary btn-custom">Back to Products</a>
          </div>

          <form id="edit-product-form">
            <input type="hidden" id="product-id" value="" />

            <div class="form-group">
              <label for="name"><strong>Name</strong></label>
              <input type="text" class="form-control" id="name" required />
            </div>

            <div class="form-group">
              <label for="price"><strong>Price</strong></label>
              <input type="number" step="0.01" class="form-control" id="price" required />
            </div>

            <div class="form-group">
              <label for="quantity"><strong>Quantity</strong></label>
              <input type="number" class="form-control" id="quantity" required />
            </div>

            <div class="text-center mt-4">
              <button type="submit" class="btn btn-primary btn-custom" onclick="updateProduct()">
                Save Changes
              </button>
            </div>
          </form>

        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="/static/scriptProducts.js"></script>

    <script>
      // Obtener el ID del usuario de la URL
      const urlParams = new URLSearchParams(window.location.search);
      //const productId = urlParams.get('id');
      const productId = {{id}};

      // Obtener la información del producto y llenar el formulario
      fetch(`http://192.168.80.3:5003/api/products/${productId}`)
          .then(response => response.json())
          .then(data => {
              document.getElementById('product-id').value = data.id;
              document.getElementById('name').value = data.name;
              document.getElementById('price').value = data.price;
              document.getElementById('quantity').value = data.quantity;
          })
          .catch(error => console.error('Error:', error));
    </script>
  </body>
</html>
