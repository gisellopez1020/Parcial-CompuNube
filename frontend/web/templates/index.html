<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mini Store</title>

<link
  rel="stylesheet"
  href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
/>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(120deg, #f4f6f9, #e3eaf3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  .login-container {
    display: flex;
    width: 900px;
    max-width: 95%;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
    overflow: hidden;
  }

  .login-left {
    flex: 1;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
    padding: 60px 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .login-left h1 {
    font-weight: 700;
    margin-bottom: 20px;
  }

  .login-left p {
    opacity: 0.9;
  }

  .login-right {
    flex: 1;
    padding: 60px 50px;
  }

  .login-right h2 {
    margin-bottom: 30px;
    font-weight: 600;
    color: #1e3c72;
  }

  .form-control {
    border-radius: 10px;
    padding: 12px;
  }

  .form-control:focus {
    box-shadow: none;
    border-color: #2a5298;
  }

  .btn-login {
    background: #1e3c72;
    color: white;
    border-radius: 10px;
    padding: 10px;
    font-weight: 500;
    transition: 0.3s ease;
  }

  .btn-login:hover {
    background: #16325c;
  }

  @media (max-width: 768px) {
    .login-container {
      flex-direction: column;
    }

    .login-left {
      text-align: center;
      padding: 40px;
    }
  }

</style>

</head>
<body>

<div class="login-container">

  <div class="login-left">
    <h1>Mini Store</h1>
    <p>
      Plataforma moderna para la gestión de usuarios,
      productos y órdenes de compra.
    </p>
  </div>

  <div class="login-right">
    <h2>Iniciar Sesión</h2>

    <form id="login-form">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" class="form-control" id="username" required />
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" class="form-control" id="password" required />
      </div>

      <button type="button" class="btn btn-login btn-block" onclick="handleLogin()">
        Ingresar
      </button>
    </form>
  </div>

</div>

<script src="static/scriptUsers.js"></script>

</body>
</html>
