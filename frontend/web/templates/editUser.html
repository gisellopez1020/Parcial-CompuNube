<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit User</title>

    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />

    <style>
      body {
        background-color: #f4f6f9;
        padding-top: 70px;
      }

      .card-custom {
        border: none;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }

      .card-header-custom {
        background: linear-gradient(90deg, #1f3c88, #2b5797);
        color: white;
        font-weight: 600;
        padding: 15px 20px;
        border-radius: 12px 12px 0 0;
      }

      .container {
        max-width: 600px;
      }

      .btn-custom {
        border-radius: 25px;
        padding: 8px 25px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card card-custom">
        <div class="card-header-custom">
          Edit User
        </div>

        <div class="card-body">

          <!-- Agregar enlace para volver a la página de inicio -->
          <div class="text-right mb-3">
            <a href="/users" class="btn btn-secondary btn-custom">Back to Users</a>
          </div>

          <form id="edit-user-form">
            <input type="hidden" id="user-id" value="" />

            <div class="form-group">
              <label for="name"><strong>Name</strong></label>
              <input type="text" class="form-control" id="name" required />
            </div>

            <div class="form-group">
              <label for="email"><strong>Email</strong></label>
              <input type="email" class="form-control" id="email" required />
            </div>

            <div class="form-group">
              <label for="username"><strong>Username</strong></label>
              <input type="text" class="form-control" id="username" required />
            </div>

            <div class="form-group">
              <label for="password"><strong>Password</strong></label>
              <input type="password" class="form-control" id="password" required />
            </div>

            <div class="text-center mt-4">
              <button type="submit" class="btn btn-primary btn-custom" onclick="updateUser()">
                Save Changes
              </button>
            </div>
          </form>

        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="/static/scriptUsers.js"></script>

    <script>
      // Obtener el ID del usuario de la URL
      const urlParams = new URLSearchParams(window.location.search);
      //const userId = urlParams.get('id');
      const userId = {{id}}

      // Obtener la información del usuario y llenar el formulario
      fetch(`http://192.168.80.3:5002/api/users/${userId}`)
          .then(response => response.json())
          .then(data => {
              document.getElementById('user-id').value = data.id;
              document.getElementById('name').value = data.name;
              document.getElementById('email').value = data.email;
              document.getElementById('username').value = data.username;
              document.getElementById('password').value = data.password;
          })
          .catch(error => console.error('Error:', error));
    </script>
  </body>
</html>
